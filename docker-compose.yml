services:
  dune-server:
    image: ghcr.io/just-for-death/dune-server:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: dune-server
    restart: unless-stopped
    ports:
      - "3023:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
    # Optional local overrides (copy .env.example to .env first).
    # Missing file is fine — built-in defaults apply.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dune-net

networks:
  dune-net:
    driver: bridge
