name: release

# Release flow: git tag v1.0.0 && git push origin v1.0.0
# Produces: GHCR server image + Linux client artifacts on the GitHub Release.
# Tags with a hyphen (e.g. v0.2.0-beta.1) publish as GitHub prereleases and do
# not move the `:latest` GHCR tag (that tracks stable releases only).
# Windows/mac installers are out of scope for v1 (see README).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags (:latest only for stable releases)
        id: image-tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/just-for-death/dune-server:${GITHUB_REF_NAME}"
            # A hyphen in the tag (v0.2.0-beta.1) marks a prerelease: publish the
            # version tag but never move `:latest` off the last stable release.
            if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
              echo "ghcr.io/just-for-death/dune-server:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

  client-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-44-${{ runner.os }}

      - name: System deps for deb packaging
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - run: npm run build:shared
      - run: npm run build:providers
      - run: npm run build:client

      - name: Package AppImage + deb
        working-directory: packages/client
        run: npx electron-builder --linux AppImage deb --publish never

      - uses: softprops/action-gh-release@v3
        with:
          files: packages/client/release/*
          generate_release_notes: true
          # A hyphen in the tag (v0.2.0-beta.1) means a prerelease; plain v1.0.0 is stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
