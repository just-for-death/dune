name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      - name: Build providers
        run: npm run build:providers

      - name: Build server
        run: npm run build:server

      - name: Lint providers, server and client
        run: npm run lint

      - name: Test shared
        run: npm run test --workspace=@dune/shared

      - name: Test providers (with coverage gate)
        run: npm run test:coverage --workspace=@dune/providers

      - name: Test server (with coverage gate)
        run: npm run test:coverage --workspace=@dune/server

      - name: Test client (unit)
        run: npm run test --workspace=@dune/client

      - name: Build client (vite only, no packaging)
        run: npm run build:client

      - name: Build docker image
        run: npm run docker:build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:shared
      - run: npm run build:providers
      - run: npm run build:client

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install browser + system deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: npm run test:e2e --workspace=@dune/client

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/client/test-results/
